name: Release

# ── Как выпустить релиз ────────────────────────────────────────────────────
#   1. Поднять version: в app/pubspec.yaml (напр. 1.18.2+31) и описать версию
#      в CHANGELOG.md разделом «## [1.18.2] — дата». Закоммитить, запушить.
#   2. git tag v1.18.2 && git push origin v1.18.2
#
#   Один тег раскладывает Fern по четырём каналам:
#     * release  — 3 split-APK в GitHub Release (оттуда их берёт апдейтер);
#     * play     — AAB в Google Play, трек internal;
#     * rustore  — универсальный APK в RuStore, черновик до ручной публикации;
#     * ios      — неподписанный .ipa в тот же GitHub Release.
#
#   Магазинные job'ы пропускаются, если их секретов в репозитории нет: пока
#   консоль не готова, релиз всё равно выходит.
#
#   Вручную (без тега): вкладка Actions → Release → Run workflow.
#   Тег и version: в pubspec ДОЛЖНЫ совпадать — иначе сборка падает намеренно.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # релиз публикуется в этом же репозитории

defaults:
  run:
    working-directory: app   # проект Flutter лежит в подкаталоге app/

jobs:
  # ── GitHub / Obtainium ─────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.setup.outputs.name }}
      code: ${{ steps.setup.outputs.code }}
      tag: ${{ steps.setup.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/flutter-release-setup
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      # Флейвор обязателен: без него Gradle собирает вариант, которого у проекта
      # нет, и flutter не находит APK («failed to produce an .apk file»).
      - name: Build release APK
        run: flutter build apk --release --flavor github --split-per-abi

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # Имена АССЕТОВ трогать нельзя: апдейтер ищет в них токен архитектуры.
          BASE="Fern-${{ steps.setup.outputs.name }}"
          OUT=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$OUT/app-$abi-github-release.apk" "dist/${BASE}-${abi}.apk"
          done
          ls -lh dist/

      # Подпись важнее самой сборки: APK с чужим ключом не встанет поверх
      # установленного, а человек увидит только «установка не удалась».
      - name: Verify signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          FP=$("$APKSIGNER" verify --print-certs \
            "dist/Fern-${{ steps.setup.outputs.name }}-arm64-v8a.apk" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Отпечаток ключа: $FP"
          if [ "$FP" != "516efd44e8af672ba7a9b101090db54698f5bb42e109c1b00ad4aaa52a2ce3a1" ]; then
            echo "::error::APK подписан НЕ тем ключом ($FP). Обновление поверх установленного не встанет — проверь секрет KEYSTORE_BASE64."
            exit 1
          fi

      - name: Generate changelog
        run: |
          # Тело релиза — раздел этой версии из CHANGELOG.md, фолбэк на коммиты.
          NAME="${{ steps.setup.outputs.name }}"
          mkdir -p dist
          {
            echo "## Fern $NAME (build ${{ steps.setup.outputs.code }})"
            echo ""
            SECTION=$(./tool/changelog_section.sh "$NAME")
            if [ -n "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
              echo "$SECTION"
            else
              PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ steps.setup.outputs.tag }}$" | head -1)
              if [ -n "$PREV_TAG" ]; then
                git log --no-merges --pretty=format:'- %s' "$PREV_TAG"..HEAD
              else
                git log --no-merges --pretty=format:'- %s' -n 20
              fi
            fi
          } > dist/notes.md
          echo "---- заметки ----"; cat dist/notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.setup.outputs.tag }}
          name: Fern ${{ steps.setup.outputs.name }}
          body_path: app/dist/notes.md
          make_latest: true
          files: |
            app/dist/Fern-${{ steps.setup.outputs.name }}-arm64-v8a.apk
            app/dist/Fern-${{ steps.setup.outputs.name }}-armeabi-v7a.apk
            app/dist/Fern-${{ steps.setup.outputs.name }}-x86_64.apk

  # ── Google Play ────────────────────────────────────────────────────────────
  # AAB на трек internal. Промоушен до production жмётся руками: там раскатка,
  # проценты и заметки для магазина, которые тегом не выражаются.
  #
  # ВАЖНО: самую первую сборку приложения Publisher API не принимает — её
  # заливают через консоль. Дальше job работает сам.
  play:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить секреты
        id: guard
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # secrets в job-level if не читаются, поэтому сторожим шагом.
          if [ -z "$SA_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON не задан — загрузка в Google Play пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        id: setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/flutter-release-setup
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      - name: Build AAB
        if: steps.guard.outputs.skip == 'false'
        run: flutter build appbundle --release --flavor play --dart-define=STORE=play

      # Play отклоняет сборки, умеющие ставить APK мимо магазина. Дешевле
      # поймать это здесь, чем ждать отказа модерации.
      - name: Проверить отсутствие REQUEST_INSTALL_PACKAGES
        if: steps.guard.outputs.skip == 'false'
        run: |
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q 'REQUEST_INSTALL_PACKAGES'; then
            echo "::error::В play-сборке осталось REQUEST_INSTALL_PACKAGES — проверь flavor."
            exit 1
          fi
          echo "чисто"

      - name: Заметки для магазина
        if: steps.guard.outputs.skip == 'false'
        run: |
          # Лимит Play — 500 символов, и резать надо по символам: `head -c`
          # разорвал бы кириллицу посреди буквы.
          mkdir -p dist/whatsnew
          NAME="${{ steps.setup.outputs.name }}"
          ./tool/changelog_section.sh "$NAME" > dist/section.txt
          python3 - "$NAME" <<'PY'
          import sys
          text = open('dist/section.txt', encoding='utf-8').read().strip()
          if not text:
              text = f'Fern {sys.argv[1]}: обновление приложения.'
          text = text[:497] + '…' if len(text) > 500 else text
          for locale in ('ru-RU', 'en-US'):
              with open(f'dist/whatsnew/whatsnew-{locale}', 'w', encoding='utf-8') as f:
                  f.write(text)
          print(text)
          PY

      - name: Upload to Google Play
        if: steps.guard.outputs.skip == 'false'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fern.app
          releaseFiles: app/build/app/outputs/bundle/playRelease/app-play-release.aab
          track: internal
          status: completed
          whatsNewDirectory: app/dist/whatsnew

  # ── RuStore ────────────────────────────────────────────────────────────────
  # Один универсальный APK нашей подписью. AAB не годится: RuStore переподписал
  # бы его своим ключом, и версия из магазина перестала бы вставать поверх
  # версии с GitHub.
  rustore:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить секреты
        id: guard
        env:
          KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::notice::RUSTORE_KEY_ID или RUSTORE_PRIVATE_KEY не задан — загрузка в RuStore пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        id: setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/flutter-release-setup
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      # Только ARM: x86_64 добавлял 52 МБ ради устройств, которых у людей нет.
      # Флагом Flutter, а не abiFilters: ndk-фильтр библиотеки Flutter не трогает.
      - name: Build universal APK
        if: steps.guard.outputs.skip == 'false'
        run: |
          flutter build apk --release --flavor rustore \
            --dart-define=STORE=rustore \
            --target-platform android-arm,android-arm64

      - name: Проверить сборку
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p dist
          APK="dist/Fern-${{ steps.setup.outputs.name }}-rustore.apk"
          cp build/app/outputs/flutter-apk/app-rustore-release.apk "$APK"

          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q 'REQUEST_INSTALL_PACKAGES'; then
            echo "::error::В rustore-сборке осталось REQUEST_INSTALL_PACKAGES — проверь flavor."
            exit 1
          fi

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [ "$FP" != "516efd44e8af672ba7a9b101090db54698f5bb42e109c1b00ad4aaa52a2ce3a1" ]; then
            echo "::error::APK подписан НЕ тем ключом ($FP) — переход между RuStore и GitHub сломается."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload to RuStore
        if: steps.guard.outputs.skip == 'false'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          ./tool/changelog_section.sh "${{ steps.setup.outputs.name }}" > dist/whatsnew.txt
          python3 tool/rustore_upload.py \
            --apk "dist/Fern-${{ steps.setup.outputs.name }}-rustore.apk" \
            --whats-new dist/whatsnew.txt

  # ── iOS ────────────────────────────────────────────────────────────────────
  # Собирается НЕПОДПИСАННЫЙ .ipa: сертификата Apple у проекта нет, а без него
  # приложение всё равно ставится — Sideloadly, AltStore и TrollStore
  # подписывают файл ключом самого человека. Отдельным job'ом и после релиза:
  # macOS-раннер медленный, и его падение не должно задерживать APK.
  #
  # App Store сюда добавится отдельным job'ом, когда приложение появится в App
  # Store Connect. Понадобятся: Apple Developer Program, сертификат
  # распространения, provisioning-профиль и ключ App Store Connect API
  # (секреты APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY),
  # сборка `flutter build ipa --export-options-plist` и заливка через altool.
  ios:
    runs-on: macos-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        id: setup
        uses: ./.github/actions/flutter-release-setup
        with:
          with-keystore: 'false'

      - name: Build unsigned app
        run: flutter build ios --release --no-codesign

      - name: Pack IPA
        run: |
          # .ipa — это zip с каталогом Payload внутри, больше ничего не нужно.
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qry "Fern-${{ steps.setup.outputs.name }}-unsigned.ipa" Payload
          rm -rf Payload
          ls -la

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.setup.outputs.tag }}
          files: app/dist/Fern-${{ steps.setup.outputs.name }}-unsigned.ipa
