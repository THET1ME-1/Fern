name: Release

# ── Как выпустить релиз ────────────────────────────────────────────────────
#   1. Поднять version: в app/pubspec.yaml (напр. 1.18.2+31) и описать версию
#      в CHANGELOG.md разделом «## [1.18.2] — дата». Закоммитить, запушить.
#   2. git tag v1.18.2 && git push origin v1.18.2
#
#   Один тег раскладывает Fern по пяти каналам:
#     * release  — 3 split-APK в GitHub Release (оттуда их берёт апдейтер);
#     * play     — AAB в Google Play, трек internal;
#     * rustore  — универсальный APK в RuStore, черновик до ручной публикации;
#     * ios      — неподписанный .ipa в тот же GitHub Release (sideload);
#     * appstore — подписанная сборка в TestFlight.
#
#   Магазинные job'ы пропускаются, если их секретов в репозитории нет: пока
#   консоль не готова, релиз всё равно выходит.
#
#   Вручную (без тега): вкладка Actions → Release → Run workflow.
#   Тег и version: в pubspec ДОЛЖНЫ совпадать — иначе сборка падает намеренно.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # релиз публикуется в этом же репозитории

defaults:
  run:
    working-directory: app   # проект Flutter лежит в подкаталоге app/

jobs:
  # ── GitHub / Obtainium ─────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.setup.outputs.name }}
      code: ${{ steps.setup.outputs.code }}
      tag: ${{ steps.setup.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/flutter-release-setup
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      # Флейвор обязателен: без него Gradle собирает вариант, которого у проекта
      # нет, и flutter не находит APK («failed to produce an .apk file»).
      - name: Build release APK
        run: flutter build apk --release --flavor github --split-per-abi

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # Имена АССЕТОВ трогать нельзя: апдейтер ищет в них токен архитектуры.
          BASE="Fern-${{ steps.setup.outputs.name }}"
          OUT=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$OUT/app-$abi-github-release.apk" "dist/${BASE}-${abi}.apk"
          done
          ls -lh dist/

      # Подпись важнее самой сборки: APK с чужим ключом не встанет поверх
      # установленного, а человек увидит только «установка не удалась».
      - name: Verify signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          FP=$("$APKSIGNER" verify --print-certs \
            "dist/Fern-${{ steps.setup.outputs.name }}-arm64-v8a.apk" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Отпечаток ключа: $FP"
          if [ "$FP" != "516efd44e8af672ba7a9b101090db54698f5bb42e109c1b00ad4aaa52a2ce3a1" ]; then
            echo "::error::APK подписан НЕ тем ключом ($FP). Обновление поверх установленного не встанет — проверь секрет KEYSTORE_BASE64."
            exit 1
          fi

      - name: Generate changelog
        run: |
          # Тело релиза — раздел этой версии из CHANGELOG.md, фолбэк на коммиты.
          NAME="${{ steps.setup.outputs.name }}"
          mkdir -p dist
          {
            echo "## Fern $NAME (build ${{ steps.setup.outputs.code }})"
            echo ""
            SECTION=$(./tool/changelog_section.sh "$NAME")
            if [ -n "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
              echo "$SECTION"
            else
              PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ steps.setup.outputs.tag }}$" | head -1)
              if [ -n "$PREV_TAG" ]; then
                git log --no-merges --pretty=format:'- %s' "$PREV_TAG"..HEAD
              else
                git log --no-merges --pretty=format:'- %s' -n 20
              fi
            fi
          } > dist/notes.md
          echo "---- заметки ----"; cat dist/notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.setup.outputs.tag }}
          name: Fern ${{ steps.setup.outputs.name }}
          body_path: app/dist/notes.md
          make_latest: true
          files: |
            app/dist/Fern-${{ steps.setup.outputs.name }}-arm64-v8a.apk
            app/dist/Fern-${{ steps.setup.outputs.name }}-armeabi-v7a.apk
            app/dist/Fern-${{ steps.setup.outputs.name }}-x86_64.apk

  # ── Google Play ────────────────────────────────────────────────────────────
  # AAB на трек internal. Промоушен до production жмётся руками: там раскатка,
  # проценты и заметки для магазина, которые тегом не выражаются.
  #
  # ВАЖНО: самую первую сборку приложения Publisher API не принимает — её
  # заливают через консоль. Дальше job работает сам.
  play:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить секреты
        id: guard
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # secrets в job-level if не читаются, поэтому сторожим шагом.
          if [ -z "$SA_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON не задан — загрузка в Google Play пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        id: setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/flutter-release-setup
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      - name: Build AAB
        if: steps.guard.outputs.skip == 'false'
        run: flutter build appbundle --release --flavor play --dart-define=STORE=play

      # Play отклоняет сборки, умеющие ставить APK мимо магазина. Дешевле
      # поймать это здесь, чем ждать отказа модерации.
      - name: Проверить отсутствие REQUEST_INSTALL_PACKAGES
        if: steps.guard.outputs.skip == 'false'
        run: |
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q 'REQUEST_INSTALL_PACKAGES'; then
            echo "::error::В play-сборке осталось REQUEST_INSTALL_PACKAGES — проверь flavor."
            exit 1
          fi
          echo "чисто"

      - name: Заметки для магазина
        if: steps.guard.outputs.skip == 'false'
        run: |
          # Лимит Play — 500 символов, и резать надо по символам: `head -c`
          # разорвал бы кириллицу посреди буквы.
          mkdir -p dist/whatsnew
          NAME="${{ steps.setup.outputs.name }}"
          ./tool/changelog_section.sh "$NAME" > dist/section.txt
          python3 - "$NAME" <<'PY'
          import sys
          text = open('dist/section.txt', encoding='utf-8').read().strip()
          if not text:
              text = f'Fern {sys.argv[1]}: обновление приложения.'
          text = text[:497] + '…' if len(text) > 500 else text
          for locale in ('ru-RU', 'en-US'):
              with open(f'dist/whatsnew/whatsnew-{locale}', 'w', encoding='utf-8') as f:
                  f.write(text)
          print(text)
          PY

      - name: Upload to Google Play
        if: steps.guard.outputs.skip == 'false'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fern.app
          releaseFiles: app/build/app/outputs/bundle/playRelease/app-play-release.aab
          track: internal
          status: completed
          whatsNewDirectory: app/dist/whatsnew

  # ── RuStore ────────────────────────────────────────────────────────────────
  # Один универсальный APK нашей подписью. AAB не годится: RuStore переподписал
  # бы его своим ключом, и версия из магазина перестала бы вставать поверх
  # версии с GitHub.
  rustore:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить секреты
        id: guard
        env:
          KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::notice::RUSTORE_KEY_ID или RUSTORE_PRIVATE_KEY не задан — загрузка в RuStore пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        id: setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/flutter-release-setup
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      # Только ARM: x86_64 добавлял 52 МБ ради устройств, которых у людей нет.
      # Флагом Flutter, а не abiFilters: ndk-фильтр библиотеки Flutter не трогает.
      - name: Build universal APK
        if: steps.guard.outputs.skip == 'false'
        run: |
          flutter build apk --release --flavor rustore \
            --dart-define=STORE=rustore \
            --target-platform android-arm,android-arm64

      - name: Проверить сборку
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p dist
          APK="dist/Fern-${{ steps.setup.outputs.name }}-rustore.apk"
          cp build/app/outputs/flutter-apk/app-rustore-release.apk "$APK"

          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q 'REQUEST_INSTALL_PACKAGES'; then
            echo "::error::В rustore-сборке осталось REQUEST_INSTALL_PACKAGES — проверь flavor."
            exit 1
          fi

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [ "$FP" != "516efd44e8af672ba7a9b101090db54698f5bb42e109c1b00ad4aaa52a2ce3a1" ]; then
            echo "::error::APK подписан НЕ тем ключом ($FP) — переход между RuStore и GitHub сломается."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload to RuStore
        if: steps.guard.outputs.skip == 'false'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          ./tool/changelog_section.sh "${{ steps.setup.outputs.name }}" > dist/whatsnew.txt
          python3 tool/rustore_upload.py \
            --apk "dist/Fern-${{ steps.setup.outputs.name }}-rustore.apk" \
            --whats-new dist/whatsnew.txt

  # ── iOS ────────────────────────────────────────────────────────────────────
  # Собирается НЕПОДПИСАННЫЙ .ipa: сертификата Apple у проекта нет, а без него
  # приложение всё равно ставится — Sideloadly, AltStore и TrollStore
  # подписывают файл ключом самого человека. Отдельным job'ом и после релиза:
  # macOS-раннер медленный, и его падение не должно задерживать APK.
  #
  # Сборка для App Store живёт ниже, отдельным job'ом `appstore`.
  ios:
    runs-on: macos-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        id: setup
        uses: ./.github/actions/flutter-release-setup
        with:
          with-keystore: 'false'

      - name: Build unsigned app
        run: flutter build ios --release --no-codesign

      - name: Pack IPA
        run: |
          # .ipa — это zip с каталогом Payload внутри, больше ничего не нужно.
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qry "Fern-${{ steps.setup.outputs.name }}-unsigned.ipa" Payload
          rm -rf Payload
          ls -la

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.setup.outputs.tag }}
          files: app/dist/Fern-${{ steps.setup.outputs.name }}-unsigned.ipa

  # ── App Store ──────────────────────────────────────────────────────────────
  # Подписанная сборка и заливка в TestFlight. Дальше человек в App Store
  # Connect добавляет сборку к версии и отправляет на ревью: тегом это не
  # выражается, а отправка на ревью необратима.
  #
  # Секреты (все обязательны, иначе job пропускается):
  #   APPSTORE_ISSUER_ID   — Issuer ID ключа App Store Connect API;
  #   APPSTORE_KEY_ID      — идентификатор того же ключа;
  #   APPSTORE_PRIVATE_KEY — содержимое .p8 целиком, вместе со строками BEGIN/END;
  #   APPSTORE_CERT_KEY    — приватный RSA-ключ, которым подписан сертификат
  #                          распространения (`openssl genrsa 2048`).
  #   APPSTORE_APP_ID      — числовой id приложения в ASC (не обязателен).
  #
  # ПОЧЕМУ ключ сертификата хранится, а не генерится каждый раз: с новым ключом
  # `fetch-signing-files --create` выпускает НОВЫЙ сертификат распространения, и
  # за десяток прогонов упирается в лимит Apple. Дальше сертификаты приходится
  # отзывать руками в портале. Один постоянный ключ — один сертификат навсегда.
  appstore:
    runs-on: macos-latest
    needs: release
    env:
      BUNDLE_ID: com.fern.flashcards
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить секреты
        id: guard
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          CERT_KEY: ${{ secrets.APPSTORE_CERT_KEY }}
        run: |
          if [ -z "$ISSUER" ] || [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ] || [ -z "$CERT_KEY" ]; then
            echo "::notice::Ключи App Store Connect не заданы — заливка в TestFlight пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        id: setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/flutter-release-setup
        with:
          with-keystore: 'false'

      - name: Установить codemagic-cli-tools
        if: steps.guard.outputs.skip == 'false'
        run: pipx install codemagic-cli-tools

      # Прогон именно в режиме канала: тесты проверяют, что в сборке для App
      # Store нет ввода ключа и ссылки на бота (правило 3.1.1) и что кнопка
      # «Восстановить покупки» на месте. Обычный прогон эту ветку не видит.
      - name: Тесты канала appstore
        if: steps.guard.outputs.skip == 'false'
        run: flutter test --dart-define=STORE=appstore

      # Подпись: свой сертификат + профиль App Store, оба скачиваются по API.
      # `set -euo pipefail` обязателен — без него провал шага проглатывается,
      # проект остаётся в автоподписи и архив падает уже в Xcode с невнятным
      # «No Accounts», хотя настоящая причина здесь.
      - name: Подписать проект
        if: steps.guard.outputs.skip == 'false'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.APPSTORE_CERT_KEY }}
        run: |
          set -euo pipefail
          keychain initialize
          # Профиль нужен каждому таргету со своим bundle id: приложению и
          # расширению «Поделиться». Пропустить второй — значит собрать .ipa,
          # который не подпишется на этапе экспорта.
          for id in "$BUNDLE_ID" "$BUNDLE_ID.ShareExtension"; do
            app-store-connect fetch-signing-files "$id" \
              --platform IOS \
              --type IOS_APP_STORE \
              --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
              --create
          done
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      # Номер сборки Apple требует уникальный и растущий, и он живёт своей
      # жизнью: versionCode Android к нему отношения не имеет. Берём последний
      # из TestFlight и прибавляем единицу, иначе заливка падает на 409
      # «bundle version must be higher than previously uploaded».
      - name: Номер сборки
        id: build
        if: steps.guard.outputs.skip == 'false'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APP_ID: ${{ secrets.APPSTORE_APP_ID }}
          FALLBACK: ${{ steps.setup.outputs.code }}
        run: |
          NUMBER=""
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || true)
            if [ -n "$LATEST" ]; then NUMBER=$((LATEST + 1)); fi
          fi
          # Приложения в ASC ещё нет или ключ не дал ответа — идём с номером из
          # pubspec. Для самой первой сборки это верно, дальше номер подхватится.
          if [ -z "$NUMBER" ]; then NUMBER="$FALLBACK"; fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "номер сборки: $NUMBER"

      - name: Build IPA
        if: steps.guard.outputs.skip == 'false'
        run: |
          flutter build ipa --release \
            --dart-define=STORE=appstore \
            --build-number "${{ steps.build.outputs.number }}" \
            --export-options-plist "$HOME/export_options.plist"

      # Манифест приватности обязан доехать до бандла. Если он выпал из
      # проекта, Apple отклонит загрузку (ITMS-91053), и узнать об этом на
      # раннере дешевле, чем письмом через полчаса.
      - name: Проверить манифест приватности
        if: steps.guard.outputs.skip == 'false'
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          if unzip -l "$IPA" | grep -q 'PrivacyInfo.xcprivacy'; then
            echo "манифест на месте"
          else
            echo "::error::В сборке нет PrivacyInfo.xcprivacy — проверь Runner в Xcode-проекте."
            exit 1
          fi

      - name: Залить в TestFlight
        if: steps.guard.outputs.skip == 'false'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --skip-package-validation
