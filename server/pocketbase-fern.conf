# Drop-in PocketBase для Fern: /etc/systemd/system/pocketbase.service.d/fern.conf
#
# ОФФЕРЫ ПОДПИСКИ. Месячный — настоящий: товар «Fern Pro» переведён на
# периодичность MONTHLY прямо через API (поля нет в их документации, но сервер
# его принимает). Годовой пока заглушка: второй тариф API не создаёт, его
# заводят в кабинете и подставляют сюда.
[Service]
Environment=FERN_OFFER_MONTH=ba5b0331-2950-419a-b2aa-8726169829f5
# Годовой тариф заводится в кабинете lava и вписывается сюда. Пока пусто —
# приложение годовую карточку не показывает.
Environment=FERN_OFFER_YEAR=
Environment=FERN_TICKET_URL=http://127.0.0.1:8160
# Возврат после оплаты: lava принимает только https, поэтому счёт ведёт
# на страницу-переходник, а она открывает fern://paid.
Environment=FERN_RETURN_URL=https://togetherly.duckdns.org/api/fern/paid
Environment=FERN_SKU=34586da0-fa77-4b5d-a080-e183e7ea8803
