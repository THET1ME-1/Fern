# Drop-in PocketBase для Fern: /etc/systemd/system/pocketbase.service.d/fern.conf
#
# ОФФЕРЫ ПОДПИСКИ. Заводятся в кабинете lava.top (товар «Fern Pro» с двумя
# тарифами) и подставляются сюда. Пока товара нет, здесь стоят заглушки:
# ни один настоящий платёж под них не подпадёт, а тесты по ним ходят.
[Service]
Environment=FERN_OFFER_MONTH=11111111-1111-1111-1111-111111111111
Environment=FERN_OFFER_YEAR=22222222-2222-2222-2222-222222222222
Environment=FERN_TICKET_URL=http://127.0.0.1:8160
Environment=FERN_RETURN_URL=fern://paid
